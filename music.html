<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音乐库 · 橙子</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/music.css">
</head>
<body data-page="music">

  <header class="site-nav">
    <div class="nav-inner">
      <a class="nav-brand" href="index.html">橙子 🍊</a>
      <button class="nav-toggle" aria-label="展开菜单" aria-expanded="false"><span></span></button>
      <nav class="nav-links" id="navLinks">
        <a href="index.html"  data-page="home">首页</a>
        <a href="work.html"   data-page="work">工作</a>
        <a href="study.html"  data-page="study">学习</a>
        <a href="fun.html"    data-page="fun">娱乐</a>
        <a href="music.html"  data-page="music">音乐</a>
      </nav>
    </div>
  </header>

  <main class="music-library container">
    <div class="library-layout">
      
      <!-- 左侧分类导航 -->
      <aside class="library-sidebar">
        <h2 class="sidebar-title">我的音乐</h2>
        <ul class="sidebar-menu">
          <li class="menu-item active" data-filter="all">
            <span class="icon">🎵</span> 发现音乐
          </li>
          <li class="menu-item" data-filter="favorites">
            <span class="icon">❤️</span> 我的收藏
          </li>
        </ul>

        <h2 class="sidebar-title" style="margin-top: 30px;">歌手分类</h2>
        <ul class="sidebar-menu">
          <li class="menu-item" data-filter="artist-A">
            <span class="icon">🎤</span> 歌手 A
          </li>
          <li class="menu-item" data-filter="artist-B">
            <span class="icon">🎸</span> 歌手 B
          </li>
        </ul>
      </aside>

      <!-- 右侧歌曲列表 -->
      <section class="library-content">
        <h1 class="page-title">发现音乐</h1>
        <p class="page-subtitle">共 <span id="songCount">3</span> 首歌曲</p>

        <ul class="song-list" id="songList">
          <!-- 歌曲 1 -->
          <li class="song-item" data-id="1" data-artist="artist-A">
            <div class="song-info">
              <span class="song-name">晚风轻抚过</span>
              <span class="song-artist">歌手 A</span>
            </div>
            <div class="song-actions">
              <button class="btn-play">▶ 播放</button>
              <button class="btn-favorite" title="收藏">♡</button>
            </div>
          </li>

          <!-- 歌曲 2 -->
          <li class="song-item" data-id="2" data-artist="artist-B">
            <div class="song-info">
              <span class="song-name">远方依旧橘色暖霞</span>
              <span class="song-artist">歌手 B</span>
            </div>
            <div class="song-actions">
              <button class="btn-play">▶ 播放</button>
              <button class="btn-favorite" title="收藏">♡</button>
            </div>
          </li>

          <!-- 歌曲 3 -->
          <li class="song-item" data-id="3" data-artist="artist-A">
            <div class="song-info">
              <span class="song-name">我们望天际之外</span>
              <span class="song-artist">歌手 A</span>
            </div>
            <div class="song-actions">
              <button class="btn-play">▶ 播放</button>
              <button class="btn-favorite" title="收藏">♡</button>
            </div>
          </li>
        </ul>
      </section>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 橙子</div>
  </footer>

  <script src="js/nav.js"></script>
  <script src="js/music.js"></script>
</body>
</html>
